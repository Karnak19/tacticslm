name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`: the lockfile is frozen, so floating the runtime
          # that reads it just moves the drift. A bun release should not be able to
          # flip a green check on an unrelated PR.
          bun-version: "1.3.13"

      - run: bun install --frozen-lockfile

      # `bun run build` is `tsc -b && vite build`, so it owns the typecheck and is
      # the acceptance bar — lint and tsc can both pass while `vite build` fails.
      # The engine self-checks are part of `bun test`; they are what proves a rules
      # change did not quietly alter combat resolution.
      - run: bunx oxlint .
      - run: bun test
      - run: bun run build
